services:
  image-gen-system:
    build: .
    container_name: "${CONTAINER_NAME:-image-laolinyun-ai}"
    network_mode: host
    environment:
      PORT: "${APP_PORT:-3010}"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      SUB2API_BASE_URL: "${SUB2API_BASE_URL:-https://s2a.laolin.ai/v1}"
      SUB2API_HOST_HEADER: "${SUB2API_HOST_HEADER:-s2a.laolin.ai}"
      SUB2API_MAX_UPLOAD_BYTES: "${SUB2API_MAX_UPLOAD_BYTES:-15000000}"
      IMAGE_EDIT_INPUT_FIDELITY: "${IMAGE_EDIT_INPUT_FIDELITY:-high}"
      IMAGE_PUBLIC_BASE_URL: "${IMAGE_PUBLIC_BASE_URL:-https://imgd.laolin.ai:18443}"
      SESSION_COOKIE_DOMAIN: "${SESSION_COOKIE_DOMAIN:-.laolin.ai}"
      SUB2API_API_KEY: "${SUB2API_API_KEY}"
      IMAGE_MODEL: "${IMAGE_MODEL:-gpt-image-2}"
      IMAGE_STORAGE_DIR: "/app/data/images"
      DATABASE_URL: "file:/app/data/app.db"
      IMAGE_REQUEST_TIMEOUT_MS: "${IMAGE_REQUEST_TIMEOUT_MS:-300000}"
      WORKER_POLL_INTERVAL_MS: "${WORKER_POLL_INTERVAL_MS:-1000}"
      COST_PER_IMAGE: "${COST_PER_IMAGE:-0.04}"
      APP_BASE_URL: "${APP_BASE_URL:-http://192.168.3.2:3010}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      UPDATE_REPO: "${UPDATE_REPO:-laolin5564/canvas-realm-gpt-image-2-studio}"
      UPDATE_CHECK_URL: "${UPDATE_CHECK_URL:-https://api.github.com/repos/laolin5564/canvas-realm-gpt-image-2-studio/releases/latest}"
      WEB_UPDATE_ENABLED: "${WEB_UPDATE_ENABLED:-false}"
      WEB_UPDATE_REPO_DIR: "${WEB_UPDATE_REPO_DIR:-/app}"
      WEB_UPDATE_LOCK_FILE: "${WEB_UPDATE_LOCK_FILE:-/tmp/canvas-realm-studio-web-update.lock}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # Web 或 worker 任一进程挂掉，容器会整体退出并被 restart 策略拉起；健康检查负责发现「进程还在但服务不可用」。
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const p=process.env.PORT||3000;const r=require('http').get({host:'127.0.0.1',port:p,path:'/api/site-settings',timeout:8000},(res)=>{res.resume();process.exit(res.statusCode&&res.statusCode<500?0:1)});r.on('timeout',()=>{r.destroy();process.exit(1)});r.on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # 国内图床直连 TLS 入口（https://imgd.laolin.ai:18443 -> 127.0.0.1:3010）。
  # 证书由美西机 acme.sh 自动续期并推送到 ./certs/（deploy-imgd-to-nas.sh）。
  img-tls-proxy:
    image: nginx:alpine
    container_name: img-tls-proxy
    network_mode: host
    volumes:
      - ./deploy/img-tls-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
