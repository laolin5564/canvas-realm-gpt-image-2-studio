# 国内图床直连 TLS 入口：https://imgd.laolin.ai:18443 -> 本机应用 3010
# 证书由美西机 acme.sh 签发（DNS-01）并经 deploy-imgd-to-nas.sh 推送到 ./certs/。
server {
    listen 18443 ssl;
    http2 on;
    server_name imgd.laolin.ai;

    ssl_certificate /etc/nginx/certs/imgd.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/imgd.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
